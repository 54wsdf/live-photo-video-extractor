name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Pin SDK for tagged source
        shell: powershell
        run: |
          dotnet new globaljson --sdk-version 8.0.425 --roll-forward latestPatch --force
          dotnet --version

      - name: Build and test standalone executable
        shell: powershell
        run: .\build-release.ps1

      - name: Generate checksum
        shell: powershell
        run: |
          $executables = @(Get-ChildItem -LiteralPath '.\artifacts\publish' -Filter '*.exe' -File)
          if ($executables.Count -ne 1) { throw "Expected one executable, found $($executables.Count)." }
          $hash = (Get-FileHash -LiteralPath $executables[0].FullName -Algorithm SHA256).Hash
          "$hash *$($executables[0].Name)" | Set-Content -LiteralPath '.\artifacts\publish\SHA256SUMS.txt' -Encoding utf8
          Write-Host "EXE_SHA256=$hash"

      - name: Upload release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $executables = @(Get-ChildItem -LiteralPath '.\artifacts\publish' -Filter '*.exe' -File)
          if ($executables.Count -ne 1) { throw "Expected one executable, found $($executables.Count)." }
          & gh.exe release upload "${{ inputs.tag }}" $executables[0].FullName '.\artifacts\publish\SHA256SUMS.txt' --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE." }
